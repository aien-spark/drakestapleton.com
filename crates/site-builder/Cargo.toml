[package]
name = "site-builder"
version = "0.1.0"
edition = "2021"
description = "Fast native Rust static site generator for drakestapleton.com"

[dependencies]
htmd = "0.5.6"
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec", rev = "24194d1b7917ef19244aae6bcaff510686b75fef" }
maud = "0.26"
pulldown-cmark = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs", rev = "9355a92bc9adfe95a6ec5f8ac926f38a0b6e7db2" }
