<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Drake Stapleton: Freedom Fighter, AI Architect &amp; Operator</title>
  <desc id="desc">An aubergine, ember, and parchment editorial card for Drake Stapleton, Freedom Fighter, AI Architect &amp; Operator.</desc>
  <defs>
    <pattern id="grid" width="102" height="102" patternUnits="userSpaceOnUse">
      <path d="M 102 0 L 0 0 0 102" fill="none" stroke="#5a4668" stroke-width="1" opacity="0.12"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede6ef" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f4efe6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#f4efe6"/>
  <rect x="760" width="440" height="630" fill="url(#grid)"/>
  <rect x="690" y="0" width="510" height="630" fill="url(#wash)"/>
  <rect width="14" height="630" fill="#a9462b"/>
  <line x1="70" y1="86" x2="1130" y2="86" stroke="#2b2233" stroke-width="4"/>
  <text x="70" y="61" fill="#a9462b" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3">FREEDOM FIGHTER · AI ARCHITECT · OPERATOR</text>
  <text x="70" y="275" fill="#2b2233" font-family="Georgia, 'Times New Roman', serif" font-size="158" letter-spacing="-7">Drake</text>
  <text x="70" y="438" fill="#2b2233" font-family="Georgia, 'Times New Roman', serif" font-size="158" letter-spacing="-7">Stapleton</text>
  <line x1="70" y1="486" x2="755" y2="486" stroke="#a9462b" stroke-width="3"/>
  <text x="70" y="540" fill="#a9462b" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">I keep finding the strength.</text>
  <text x="790" y="442" fill="#5a4668" font-family="Georgia, 'Times New Roman', serif" font-size="350" opacity="0.12">32</text>
  <text x="800" y="570" fill="#544a52" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">ORCHESTRATION · GPU SYSTEMS · EVIDENCE · ATLAS</text>
</svg>
