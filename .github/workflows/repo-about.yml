name: repo-about
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  about:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository About
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}" -X PATCH \
            -f homepage='https://www.aienos.com/engineer/' \
            -f description='Merged into https://www.aienos.com/engineer/ (About the engineer). This repository now serves redirect stubs for drakestapleton.com.'
